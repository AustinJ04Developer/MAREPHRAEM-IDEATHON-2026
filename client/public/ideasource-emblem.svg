<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <defs>
    <!-- Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(20, 10)">
    <!-- ORANGE (Upper-Left Circuit Halves) -->
    <!-- Bulb Contour Left Arc (Orange) -->
    <path d="M 100 16 C 70 16 48 38 48 70 C 48 92 60 110 70 126 L 82 142" 
          stroke="url(#orangeGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Orange Circuit Line 1 (Outer) -->
    <path d="M 64 54 L 82 72 L 82 92" 
          stroke="url(#orangeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="82" cy="92" r="5" fill="#ea580c" />

    <!-- Orange Circuit Line 2 (Mid-Top) -->
    <path d="M 96 28 L 86 38 L 86 64 L 72 78" 
          stroke="url(#orangeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="72" cy="78" r="5" fill="#ea580c" />

    <!-- Orange Circuit Line 3 (Diagonal Core) -->
    <path d="M 100 48 L 100 80 L 88 94 L 88 118" 
          stroke="url(#orangeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="88" cy="118" r="5" fill="#ea580c" />

    <!-- Additional Orange Node Pads -->
    <circle cx="64" cy="54" r="5" fill="#ff7b00" />
    <circle cx="96" cy="28" r="5" fill="#ff7b00" />

    <!-- BLUE / CYAN (Lower-Right Circuit Halves) -->
    <!-- Bulb Contour Right Arc (Cyan-Blue) -->
    <path d="M 100 16 C 130 16 152 38 152 70 C 152 92 140 110 130 126 L 118 142" 
          stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Blue Circuit Line 1 (Center-Right Core) -->
    <path d="M 112 36 L 112 68 L 126 82 L 126 102" 
          stroke="url(#blueGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="112" cy="36" r="5" fill="#38bdf8" />
    <circle cx="126" cy="102" r="5" fill="#0284c7" />

    <!-- Blue Circuit Line 2 (Diagonal Lower) -->
    <path d="M 136 60 L 122 74 L 122 108 L 112 120" 
          stroke="url(#blueGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="136" cy="60" r="5" fill="#38bdf8" />
    <circle cx="112" cy="120" r="5" fill="#0284c7" />

    <!-- Blue Circuit Line 3 (Bottom Neck Feed) -->
    <path d="M 102 96 L 114 108 L 114 132" 
          stroke="url(#blueGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="102" cy="96" r="5" fill="#38bdf8" />
    <circle cx="114" cy="132" r="5" fill="#0284c7" />

    <!-- Bulb Screw Base (Cyan-Blue) -->
    <rect x="80" y="148" width="40" height="9" rx="4.5" fill="url(#blueGrad)" />
    <rect x="83" y="161" width="34" height="8" rx="4" fill="url(#blueGrad)" />
    <rect x="87" y="173" width="26" height="7" rx="3.5" fill="url(#blueGrad)" />
    <!-- Base Bottom Contact -->
    <path d="M 93 182 Q 100 188 107 182 Z" fill="#0369a1" />
  </g>

  <!-- Typography: Marephraem Ideasource -->
  <text x="120" y="235" 
        text-anchor="middle" 
        fill="#1e3a8a" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="0.2">
    Marephraem Ideasource
  </text>
</svg>
