# ==========================================
# Netlify Configuration - MAREPHRAEM IDEATHON 2026
# ==========================================

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Single-Page Application (SPA) Client Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
